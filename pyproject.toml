[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fronts"
version = "0.1.0"
description = "Plan organic distribution as an imperfect-information game, inside a world model an LLM wrote."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "owles.works" }]
keywords = [
    "game-theory",
    "world-models",
    "ismcts",
    "distribution",
    "growth",
    "program-synthesis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core game, world-model and solver layers depend on nothing outside the
# standard library. That is a deliberate constraint, not an accident of youth:
# a planner with a numpy dependency is a planner people cannot drop into a
# Lambda, and a repository that needs a wheel built before it will tell you
# anything is a repository nobody evaluates. Extras buy you provider clients
# and platform I/O, and nothing else -- the CLI is argparse on purpose.
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
platforms = ["composio>=0.8"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]
all = ["fronts[llm,platforms]"]

[project.scripts]
fronts = "fronts.cli:app"

[project.urls]
Homepage = "https://github.com/samuelowles/fronts"
Source = "https://github.com/samuelowles/fronts"

[tool.hatch.build.targets.wheel]
packages = ["src/fronts"]

# Ship the example config in the wheel too, next to the package: a config
# format nobody can find an example of is a format nobody configures, and
# `fronts.example.toml` is the documented starting point for [measurement].
[tool.hatch.build.targets.wheel.force-include]
"fronts.example.toml" = "fronts.example.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast pure-function tests, no subprocess and no network",
    "e2e: drives the whole loop across module boundaries and asserts on outcomes; offline, no credentials",
]
addopts = "--timeout=60"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # UP042 wants StrEnum. The action-space enums deliberately inherit from
    # (str, Enum) instead: their members are serialised into ActionKey strings
    # and compared against raw strings decoded from stored trajectories, and
    # that idiom works identically on 3.10, which is what several contributors
    # will actually run despite the floor below.
    "UP042",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

# The provider SDKs are optional extras imported lazily INSIDE functions (the
# core must import with nothing installed -- see cwm/llm.py and
# adapters/composio_io.py). Type-checking must not demand that a machine with
# no extras installed has stubs for them; ignoring the missing import keeps the
# import lazy while still checking everything on our side of the call.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "openai", "openai.*", "composio", "composio.*", "tomli"]
ignore_missing_imports = true
